<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hubungkan — AetherDesk</title>
<link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
<div class="wrap" id="wadah">
  <div class="judul-halaman sempit-judul">
    <span class="eyebrow">Viewer · Quick Connect</span>
    <h1>Hubungkan ke perangkat</h1>
  </div>

  <!-- ── Masuk ────────────────────────────────────────────────────────────── -->
  <section class="card sempit" id="kartuMasuk">
    <h2>Masuk</h2>
    <div class="field">
      <label for="slug">Organisasi</label>
      <input id="slug" class="mono" placeholder="nama-organisasi" autocomplete="organization">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="sandi">Kata sandi</label>
      <input id="sandi" type="password" autocomplete="current-password">
    </div>
    <div class="baris"><button id="btnMasuk">Masuk</button></div>
    <p class="status" id="statusMasuk"></p>
  </section>

  <!-- ── Quick Connect ────────────────────────────────────────────────────── -->
  <section class="card sempit" id="kartuConnect" hidden>
    <h2>Quick Connect</h2>
    <p class="kecil">Masukkan Device ID dan kata sandi yang ditampilkan pada
       perangkat yang akan diakses.</p>
    <div class="field">
      <label for="devId">Device ID</label>
      <input id="devId" class="mono" inputmode="numeric" placeholder="942 716 382" maxlength="11">
    </div>
    <div class="field">
      <label for="devSandi">Kata sandi sesi</label>
      <input id="devSandi" class="mono" placeholder="8 karakter" maxlength="8" autocapitalize="characters">
    </div>
    <div class="baris"><button id="btnHubungkan">Hubungkan</button></div>
    <p class="status" id="statusConnect"></p>
  </section>

  <!-- ── Sesi ─────────────────────────────────────────────────────────────── -->
  <section class="card" id="kartuSesi" hidden>
    <div class="card-head">
      <h2>Sesi aktif</h2>
      <span class="badge wait" id="lencanaSesi">menghubungkan</span>
      <span class="badge" id="lencanaKendali" hidden></span>
    </div>

    <div class="panggung">
      <video id="layar" autoplay playsinline></video>
      <div class="hud" id="hud">
        <div><span>Latensi</span><b id="hRtt">—</b></div>
        <div><span>FPS</span><b id="hFps">—</b></div>
        <div><span>Resolusi</span><b id="hRes">—</b></div>
        <div><span>Bitrate</span><b id="hBitrate">—</b></div>
        <div><span>Jalur</span><b id="hJalur">—</b></div>
      </div>
    </div>

    <!-- Pemilih monitor. Tersembunyi sampai agent melaporkan lebih dari satu
         layar — satu tombol untuk satu-satunya pilihan hanya menambah bising. -->
    <div class="baris rapat" id="pilihMonitor" hidden>
      <span class="kecil" style="margin-right:.25rem">Monitor</span>
    </div>

    <div class="baris rapat">
      <button id="btnLayarPenuh" class="sekunder">Layar penuh</button>
      <button id="btnHud" class="sekunder">Sembunyikan statistik</button>
      <button id="btnPutus" class="bahaya">Akhiri sesi</button>
    </div>
    <p class="status" id="statusSesi"></p>
  </section>

  <footer>aetherdesk.masamune.my.id</footer>
</div>

<script type="module">
import { api, simpanToken, hapusToken, adaSesi, aksesSegar, saatSesiHabis,
         Signal, Kanal, jelaskanKegagalan, pasangHeader,
         $, status, statistik } from '/app.js?v=10';

pasangHeader('/viewer');

let signal = null;
let kanal = null;
let kontrol = null;
let bolehKendali = false;

/**
 * Peta `KeyboardEvent.code` ke scancode PS/2 set 1.
 *
 * Scancode, bukan virtual key. Mengirim virtual key membuat huruf yang diketik
 * bergantung pada tata letak yang aktif di mesin tujuan, sehingga viewer
 * ber-QWERTY yang mengakses mesin ber-AZERTY menghasilkan huruf yang salah.
 * `KeyboardEvent.code` sendiri sudah menyatakan posisi fisik tombol, bukan
 * huruf yang tercetak padanya — jadi ia memang pasangan yang tepat.
 *
 * Nilai `true` menandai tombol yang dikirim dengan awalan E0.
 */
const SCANCODE = {
  Escape:[0x01],Digit1:[0x02],Digit2:[0x03],Digit3:[0x04],Digit4:[0x05],Digit5:[0x06],
  Digit6:[0x07],Digit7:[0x08],Digit8:[0x09],Digit9:[0x0A],Digit0:[0x0B],
  Minus:[0x0C],Equal:[0x0D],Backspace:[0x0E],Tab:[0x0F],
  KeyQ:[0x10],KeyW:[0x11],KeyE:[0x12],KeyR:[0x13],KeyT:[0x14],KeyY:[0x15],
  KeyU:[0x16],KeyI:[0x17],KeyO:[0x18],KeyP:[0x19],
  BracketLeft:[0x1A],BracketRight:[0x1B],Enter:[0x1C],ControlLeft:[0x1D],
  KeyA:[0x1E],KeyS:[0x1F],KeyD:[0x20],KeyF:[0x21],KeyG:[0x22],KeyH:[0x23],
  KeyJ:[0x24],KeyK:[0x25],KeyL:[0x26],
  Semicolon:[0x27],Quote:[0x28],Backquote:[0x29],ShiftLeft:[0x2A],Backslash:[0x2B],
  KeyZ:[0x2C],KeyX:[0x2D],KeyC:[0x2E],KeyV:[0x2F],KeyB:[0x30],KeyN:[0x31],KeyM:[0x32],
  Comma:[0x33],Period:[0x34],Slash:[0x35],ShiftRight:[0x36],
  NumpadMultiply:[0x37],AltLeft:[0x38],Space:[0x39],CapsLock:[0x3A],
  F1:[0x3B],F2:[0x3C],F3:[0x3D],F4:[0x3E],F5:[0x3F],F6:[0x40],
  F7:[0x41],F8:[0x42],F9:[0x43],F10:[0x44],F11:[0x57],F12:[0x58],
  NumLock:[0x45],ScrollLock:[0x46],
  Numpad7:[0x47],Numpad8:[0x48],Numpad9:[0x49],NumpadSubtract:[0x4A],
  Numpad4:[0x4B],Numpad5:[0x4C],Numpad6:[0x4D],NumpadAdd:[0x4E],
  Numpad1:[0x4F],Numpad2:[0x50],Numpad3:[0x51],Numpad0:[0x52],NumpadDecimal:[0x53],
  IntlBackslash:[0x56],
  // Tombol berawalan E0 — posisinya berbagi kode dengan tombol numpad.
  NumpadEnter:[0x1C,true],ControlRight:[0x1D,true],NumpadDivide:[0x35,true],
  AltRight:[0x38,true],Home:[0x47,true],ArrowUp:[0x48,true],PageUp:[0x49,true],
  ArrowLeft:[0x4B,true],ArrowRight:[0x4D,true],End:[0x4F,true],
  ArrowDown:[0x50,true],PageDown:[0x51,true],Insert:[0x52,true],Delete:[0x53,true],
  MetaLeft:[0x5B,true],MetaRight:[0x5C,true],ContextMenu:[0x5D,true],
};

/** Menampilkan tingkat izin yang diberikan agent, dan menyalakan input bila ada. */
function terapkanTingkat(level) {
  bolehKendali = level === 'kendali';
  const l = $('#lencanaKendali');
  if (!l) return;
  l.hidden = false;
  l.className = bolehKendali ? 'badge ok' : 'badge';
  l.textContent = bolehKendali ? 'kendali penuh' : 'lihat saja';
  l.title = bolehKendali
    ? 'Mouse dan papan ketik Anda dikirim ke perangkat itu.'
    : 'Perangkat itu tidak mengizinkan kendali. Agent dijalankan tanpa --izinkan-kendali.';
  if (bolehKendali) $('#layar')?.focus();
}

function kirimKendali(pesan) {
  if (!bolehKendali || kontrol?.readyState !== 'open') return;
  kontrol.send(JSON.stringify(pesan));
}

/** Posisi kursor sebagai pecahan 0–1 terhadap gambar, bukan terhadap elemen. */
function posisiRelatif(ev, video) {
  const r = video.getBoundingClientRect();
  // `object-fit: contain` menyisakan pita kosong di sisi yang tidak terisi.
  // Menghitung terhadap seluruh elemen akan menggeser seluruh koordinat, dan
  // gesernya berubah setiap kali jendela diubah ukurannya.
  const rasioVideo = (video.videoWidth || 16) / (video.videoHeight || 9);
  const rasioKotak = r.width / r.height;
  let lebar = r.width, tinggi = r.height, kiri = r.left, atas = r.top;
  if (rasioKotak > rasioVideo) {
    lebar = r.height * rasioVideo;
    kiri += (r.width - lebar) / 2;
  } else {
    tinggi = r.width / rasioVideo;
    atas += (r.height - tinggi) / 2;
  }
  return {
    x: Math.min(1, Math.max(0, (ev.clientX - kiri) / lebar)),
    y: Math.min(1, Math.max(0, (ev.clientY - atas) / tinggi)),
  };
}

/** Memasang penangkap input pada elemen video. */
function pasangKendali(video) {
  let kirimBerikutnya = 0;

  video.addEventListener('mousemove', (ev) => {
    // Gerakan dibatasi ~120 per detik. Tanpa itu satu gerakan cepat mengirim
    // ratusan pesan yang seluruhnya menggambarkan jalur yang sama.
    const t = performance.now();
    if (t < kirimBerikutnya) return;
    kirimBerikutnya = t + 8;
    kirimKendali({ type: 'MOUSE', payload: { aksi: 'gerak', ...posisiRelatif(ev, video) } });
  });

  video.addEventListener('mousedown', (ev) => {
    ev.preventDefault();
    video.focus();
    kirimKendali({ type: 'MOUSE', payload: { aksi: 'tekan', tombol: ev.button, ...posisiRelatif(ev, video) } });
  });

  video.addEventListener('mouseup', (ev) => {
    ev.preventDefault();
    kirimKendali({ type: 'MOUSE', payload: { aksi: 'lepas', tombol: ev.button, ...posisiRelatif(ev, video) } });
  });

  // Menu konteks browser akan menutupi layar jarak jauh tepat ketika pengguna
  // bermaksud membuka menu konteks di sana.
  video.addEventListener('contextmenu', (ev) => { if (bolehKendali) ev.preventDefault(); });

  video.addEventListener('wheel', (ev) => {
    if (!bolehKendali) return;
    ev.preventDefault();
    // Satu detent roda adalah 120 pada Windows; browser melaporkan piksel.
    const delta = Math.sign(ev.deltaY) * -120;
    kirimKendali({ type: 'MOUSE', payload: { aksi: 'gulir', delta } });
  }, { passive: false });

  const tombol = (ev, tekan) => {
    if (!bolehKendali) return;
    const peta = SCANCODE[ev.code];
    if (!peta) return;
    ev.preventDefault();
    kirimKendali({
      type: 'KEYBOARD',
      payload: { scancode: peta[0], tekan, extended: !!peta[1] },
    });
  };
  video.addEventListener('keydown', (ev) => tombol(ev, true));
  video.addEventListener('keyup', (ev) => tombol(ev, false));
}

/**
 * Menggambar tombol pemilih monitor dari `MONITOR_LAYOUT`.
 *
 * Monitor dirujuk dengan nama perangkat, bukan indeks. Urutan enumerasi di
 * sisi agent tidak dijanjikan stabil, sehingga mencabut satu layar akan
 * menggeser indeks yang lain — dan tombol akan menunjuk monitor yang salah
 * tanpa satu pun galat muncul.
 */
function gambarPilihMonitor({ monitors = [], active } = {}) {
  const wadah = $('#pilihMonitor');
  wadah.querySelectorAll('button').forEach((b) => b.remove());

  if (monitors.length < 2) { wadah.hidden = true; return; }
  wadah.hidden = false;

  // Layout baru berarti perpindahan sudah selesai; pesan "berpindah…" yang
  // tertinggal akan membuat sesi yang sehat terlihat menggantung.
  status($('#statusSesi'), '', 'ok');

  monitors.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = m.name === active ? '' : 'sekunder';
    // Nama perangkat Windows (`\\.\DISPLAY1`) tidak berarti apa pun bagi
    // pengguna. Yang menolong justru ukuran dan penanda primer.
    b.textContent = `${i + 1} · ${m.width}×${m.height}${m.is_primary ? ' ·' : ''}`;
    b.title = `${m.name} pada (${m.x}, ${m.y})${m.is_primary ? ' — monitor primer' : ''}`;
    b.disabled = m.name === active;
    b.onclick = () => {
      if (kontrol?.readyState !== 'open') return;
      kontrol.send(JSON.stringify({ type: 'MONITOR_SELECT', payload: { name: m.name } }));
      status($('#statusSesi'), `berpindah ke monitor ${i + 1}…`, 'wait');
    };
    wadah.appendChild(b);
  });
}
let sessionId = null;
let timerHud = null;
let bytesTerakhir = 0, waktuTerakhir = 0;

const tampil = (el, ya = true) => { el.hidden = !ya; };
const lencana = (kelas, teks) => {
  const el = $('#lencanaSesi');
  el.className = 'badge ' + kelas;
  el.textContent = teks;
};

// ── Masuk ────────────────────────────────────────────────────────────────────
$('#btnMasuk').onclick = async () => {
  const el = $('#statusMasuk');
  status(el, 'menghubungi server…', 'wait');
  try {
    const r = await api('/v1/auth/login', {
      method: 'POST',
      body: {
        org_slug: $('#slug').value.trim(),
        email: $('#email').value.trim(),
        password: $('#sandi').value,
      },
    });
    simpanToken(r.access_token, r.refresh_token);
    tampil($('#kartuMasuk'), false);
    tampil($('#kartuConnect'), true);
  } catch (e) { status(el, e.message, 'bad'); }
};

// ── Quick Connect ────────────────────────────────────────────────────────────
$('#btnHubungkan').onclick = async () => {
  const el = $('#statusConnect');
  const devId = $('#devId').value.replace(/\D/g, '');
  const sandi = $('#devSandi').value;

  status(el, 'memeriksa kredensial…', 'wait');

  let sesi;
  try {
    sesi = await api('/v1/connect', { method: 'POST', body: { device_id: devId, password: sandi } });
  } catch (e) {
    // Server sengaja menjawab sama untuk seluruh sebab kegagalan supaya tidak
    // menjadi oracle bagi pemindai ruang ID. Pesannya diteruskan apa adanya.
    status(el, e.code === 'CONFLICT' ? 'perangkat sedang offline' : e.message, 'bad');
    return;
  }

  sessionId = sesi.session_id;
  status(el, 'menunggu persetujuan di perangkat tujuan…', 'wait');

  signal = new Signal(await aksesSegar(), null);

  signal.addEventListener('SESSION_ACCEPTED', () =>
    status(el, 'disetujui — menegosiasikan media…', 'wait'));

  signal.addEventListener('SESSION_REJECTED', (ev) => {
    status(el, `permintaan ditolak${ev.detail.reason ? ': ' + ev.detail.reason : ''}`, 'bad');
    bersihkan();
  });

  // Kanal dibuat sekarang, bukan menunggu SDP_OFFER. Agent mulai mengirim
  // kandidat ICE segera setelah setLocalDescription — jauh sebelum offer-nya
  // sampai ke sini. Tanpa kanal yang sudah siap, kandidat-kandidat awal itu
  // tidak punya tempat mendarat dan hilang tanpa jejak.
  kanal = await Kanal.buat({
    onKandidat: (c) => signal.kirim('ICE_CANDIDATE', { session_id: sessionId, candidate: c }),
    onStatus: (s, d) => {
      if (s === 'failed') {
        lencana('bad', 'gagal');
        status($('#statusSesi'), jelaskanKegagalan(d), 'bad');
        console.warn('diagnosa viewer', d);
      } else if (s === 'connected') {
        lencana('ok', 'tersambung');
        status($('#statusSesi'), '', 'ok');
      } else {
        lencana('wait', s);
      }
    },
  });

  // Kanal kendali dibuat agent, jadi viewer menunggunya. Agent berbasis
  // browser tidak membuatnya sama sekali — pemilih monitor akan tetap
  // tersembunyi di sana, dan itu memang benar: satu tab hanya punya satu
  // aliran layar.
  kanal.pc.ondatachannel = (ev) => {
    if (ev.channel.label !== 'kontrol') return;
    kontrol = ev.channel;
    kontrol.onmessage = (m) => {
      let pesan;
      try { pesan = JSON.parse(m.data); } catch { return; }
      if (pesan.type === 'MONITOR_LAYOUT') gambarPilihMonitor(pesan.payload);
      else if (pesan.type === 'CONTROL_LEVEL') terapkanTingkat(pesan.payload?.level);
      else if (pesan.type === 'INPUT_PAUSED') {
        // Agent menjeda karena ada tangan di mesin itu. Menyebutkan sebabnya
        // mencegah pengguna menyimpulkan koneksinya yang bermasalah.
        status($('#statusSesi'), 'input dijeda — pengguna di perangkat sedang memakai mouse', 'wait');
      }
    };
    kontrol.onclose = () => { kontrol = null; };
  };

  kanal.pc.ontrack = (e) => {
    const video = $('#layar');
    video.srcObject = e.streams[0];
    // `tabindex` membuat elemen video dapat menerima peristiwa papan ketik;
    // tanpa itu `keydown` tidak akan pernah sampai ke sini.
    video.tabIndex = 0;
    pasangKendali(video);
    tampil($('#kartuConnect'), false);
    tampil($('#kartuSesi'), true);
    $('#wadah').classList.add('lebar');
    mulaiHud();
  };

  signal.addEventListener('SDP_OFFER', async (ev) => {
    await kanal.terapkanRemote('offer', ev.detail.sdp);
    const answer = await kanal.pc.createAnswer();
    await kanal.pc.setLocalDescription(answer);
    signal.kirim('SDP_ANSWER', { session_id: sessionId, sdp: answer.sdp });
  });

  signal.addEventListener('ICE_CANDIDATE', async (ev) => {
    await kanal?.tambahKandidat(ev.detail.candidate);
  });

  signal.addEventListener('SESSION_END', () => {
    status($('#statusSesi'), 'sesi diakhiri dari sisi perangkat', 'wait');
    bersihkan();
  });

  signal.addEventListener('TERPUTUS', () => status(el, 'signaling terputus', 'bad'));

  try {
    await signal.hubungkan();
    signal.kirim('SESSION_REQUEST', { session_id: sessionId, device_uuid: sesi.device_uuid });
  } catch (e) { status(el, e.message, 'bad'); }
};

// ── HUD statistik (VIEWER.md §2) ─────────────────────────────────────────────
function mulaiHud() {
  clearInterval(timerHud);
  timerHud = setInterval(async () => {
    if (!kanal) return;
    const s = await statistik(kanal.pc);
    const d = kanal.diagnosa();
    $('#hJalur').textContent = d.punyaRelay ? 'relay' : d.punyaSrflx ? 'srflx' : 'host';
    $('#hRtt').textContent = s.rtt != null ? `${s.rtt} ms` : '—';
    $('#hFps').textContent = s.fps != null ? Math.round(s.fps) : '—';
    $('#hRes').textContent = s.lebar ? `${s.lebar}×${s.tinggi}` : '—';

    if (s._bytes != null && waktuTerakhir) {
      const dt = (s._ts - waktuTerakhir) / 1000;
      const kbps = dt > 0 ? ((s._bytes - bytesTerakhir) * 8) / dt / 1000 : 0;
      $('#hBitrate').textContent = kbps > 1000 ? `${(kbps / 1000).toFixed(1)} Mbps` : `${Math.round(kbps)} kbps`;
    }
    bytesTerakhir = s._bytes ?? 0;
    waktuTerakhir = s._ts ?? 0;
  }, 1000);
}

// ── Kontrol ──────────────────────────────────────────────────────────────────
$('#btnLayarPenuh').onclick = () => document.querySelector('.panggung').requestFullscreen?.();

$('#btnHud').onclick = (e) => {
  const hud = $('#hud');
  hud.hidden = !hud.hidden;
  e.target.textContent = hud.hidden ? 'Tampilkan statistik' : 'Sembunyikan statistik';
};

$('#btnPutus').onclick = () => {
  if (signal && sessionId) signal.kirim('SESSION_END', { session_id: sessionId });
  bersihkan();
  status($('#statusConnect'), 'sesi diakhiri', 'wait');
};

function bersihkan() {
  clearInterval(timerHud);
  kanal?.tutup(); kanal = null;
  signal?.tutup(); signal = null;
  kontrol = null;
  bolehKendali = false;
  sessionId = null;
  const l = $('#lencanaKendali');
  if (l) l.hidden = true;
  $('#layar').srcObject = null;
  // Pemilih monitor milik sesi, bukan milik halaman. Tombol yang tertinggal
  // dari sesi sebelumnya akan menunjuk perangkat yang sudah tidak terhubung.
  gambarPilihMonitor({ monitors: [] });
  tampil($('#kartuSesi'), false);
  tampil($('#kartuConnect'), true);
  $('#wadah').classList.remove('lebar');
}

saatSesiHabis(() => {
  hapusToken();
  bersihkan();
  tampil($('#kartuConnect'), false);
  tampil($('#kartuMasuk'), true);
  status($('#statusMasuk'), 'Sesi Anda berakhir. Silakan masuk lagi.', 'wait');
});

if (adaSesi()) { tampil($('#kartuMasuk'), false); tampil($('#kartuConnect'), true); }
</script>
</body>
</html>
