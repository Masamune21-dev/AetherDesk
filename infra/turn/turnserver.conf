# ── coturn untuk AetherDesk ───────────────────────────────────────────────────
#
# Nilai __IP_ORIGIN__, __SUBNET_LAN__, dan static-auth-secret sengaja
# disamarkan. Isi saat provisioning dari `ip addr` dan `env/aetherdesk.env`
# di server; jangan pernah menuliskannya kembali ke repositori.
# Dikelola sebagai bagian dari deployment; lihat infra/turn/turnserver.conf.

listening-port=3478
listening-ip=__IP_ORIGIN__
relay-ip=__IP_ORIGIN__
external-ip=__IP_ORIGIN__

realm=aetherdesk.masamune.my.id
server-name=aetherdesk.masamune.my.id

# Kredensial HMAC berumur pendek, diterbitkan API. Tidak ada kata sandi statis
# yang tertanam di klien — yang bocor hanya berlaku beberapa jam.
use-auth-secret
static-auth-secret=__DIISI_SAAT_PROVISIONING__

# Rentang relay. Sengaja sempit: setiap port harus dibuka di ufw, dan 100 port
# jauh melampaui kebutuhan Fase 0.
min-port=49160
max-port=49260

# ── Pengerasan ────────────────────────────────────────────────────────────────
# INI BAGIAN TERPENTING. Tanpa daftar tolak di bawah, siapa pun yang memperoleh
# kredensial TURN dapat meminta server ini meneruskan paket ke alamat mana pun
# yang bisa dijangkaunya — termasuk __SUBNET_LAN__.0/24 tempat host Proxmox dan
# mesin lain berada. TURN yang terbuka berubah menjadi pintu masuk ke LAN.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Batas pemakaian — relay adalah komponen termahal, dan kuota membuat
# penyalahgunaan terlihat sebelum menjadi tagihan.
user-quota=12
total-quota=600
max-bps=2000000

fingerprint
no-cli
no-tlsv1
no-tlsv1_1
no-stdout-log
log-file=/var/log/turnserver.log
simple-log
