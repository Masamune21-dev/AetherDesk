# ── aetherdesk.masamune.my.id ── AetherDesk control plane (Fase 0) ────────────
# SPA statis (Vue 3) + API Rust (127.0.0.1:8080) + Signal WS (127.0.0.1:8081).
#
# CATATAN: masamune adalah default_server di :80/:443. Blok ini TIDAK BOLEH
# default_server — nginx merutekan ke sini lewat SNI / Host.

server {
    listen 80;
    listen [::]:80;
    server_name aetherdesk.masamune.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aetherdesk.masamune.my.id;

    root /var/www/aetherdesk.masamune.my.id/dashboard;
    index index.html;

    # Cloudflare Origin Certificate (SAN: aetherdesk.masamune.my.id), berlaku s/d 2041.
    ssl_certificate     /etc/ssl/cloudflare/aetherdesk.masamune.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/aetherdesk.masamune.my.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Authenticated Origin Pull disiapkan, penegakan masih off — sama seperti vhost masamune.
    ssl_client_certificate /etc/ssl/cloudflare/aop-ca.pem;
    ssl_verify_client off;

    # Pulihkan IP asli pengunjung dari CF-Connecting-IP.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/aetherdesk.access.log;
    error_log  /var/log/nginx/aetherdesk.error.log;

    autoindex off;
    client_max_body_size 25m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($http_user_agent ~* (sqlmap|nikto|masscan|zgrab|acunetix|nessus)) {
        return 444;
    }

    # REST API — 502 sampai rdp-api berjalan.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Signaling WebSocket — 502 sampai rdp-signal berjalan.
    # Cloudflare memutus WS idle ~100 detik; signal server ping tiap 25 detik.
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx-ok\n";
    }

    # Kode aplikasi tidak memakai hash isi pada nama berkasnya, jadi harus
    # divalidasi ulang setiap muat. ETag membuat validasi itu murah: browser
    # menerima 304 tanpa mengunduh isinya lagi.
    #
    # Sebelumnya blok ini memakai `expires 7d`, disalin dari vhost aset statis.
    # Akibatnya browser menahan app.js lama sementara HTML sudah baru, impor
    # gagal, dan seluruh skrip halaman mati tanpa pesan apa pun.
    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Aset yang memang jarang berubah.
    location ~* \.(png|jpg|jpeg|gif|svg|woff2|ico|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback.
    #
    # HTML tidak boleh di-cache: berkas inilah yang menyebut versi aset yang
    # harus dimuat. Bila HTML tertahan di cache sementara asetnya sudah baru,
    # halaman memuat kombinasi yang tidak pernah diuji — persis kegagalan yang
    # membuat tombol Masuk mati tanpa pesan apa pun.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
