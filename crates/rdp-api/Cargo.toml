[package]
name = "rdp-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "API Server AetherDesk (REST)"

[dependencies]
rdp-core = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

sqlx = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `full` tidak menyertakan `test-util`; fitur itu yang menyediakan
# `#[tokio::test(start_paused = true)]` untuk menguji logika berbasis waktu
# tanpa benar-benar menunggu.
tokio = { workspace = true, features = ["test-util"] }
