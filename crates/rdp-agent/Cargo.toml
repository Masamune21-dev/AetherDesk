[package]
name = "rdp-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent native AetherDesk — capture layar, injeksi input, multi-monitor"

[dependencies]
rdp-core = { workspace = true }

tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# WebRTC murni Rust. Satu-satunya jalan mengirim media ke browser tanpa
# menyeret libwebrtc beserta rantai build C++-nya — dan browser adalah viewer
# yang sudah berjalan di produksi, jadi ia yang menentukan protokolnya.
#
# Dipatok ke 0.14, bukan 0.20. Rilis 0.20 adalah penulisan ulang di atas inti
# Sans-I/O dengan API yang jauh lebih rendah tingkatnya — `TrackLocalStaticSample`
# di sana menuntut `MediaStreamTrack` yang SSRC dan codec-nya disusun sendiri.
# Rancangannya menarik, tetapi mempelajarinya sambil mengejar frame pertama
# menambah satu variabel yang tidak perlu. 0.14 adalah rilis klasik terakhir,
# dan itu yang dipakai hampir seluruh contoh yang ada.
webrtc = "0.14"

# Jendela aplikasi. `glow` (OpenGL) alih-alih `wgpu`: antarmukanya hanya teks
# dan tombol, dan wgpu menyeret rantai dependensi yang jauh lebih besar untuk
# kemampuan yang tidak dipakai satu pun di sini.
eframe = { version = "0.29", default-features = false, features = [
    "glow", "default_fonts",
] }
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { workspace = true }
serde_json = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # Capture layar — DXGI Desktop Duplication di atas perangkat Direct3D 11.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Encode H.264 — Media Foundation Transform.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # Injeksi input — SendInput.
    "Win32_UI_Input_KeyboardAndMouse",
    # Jalan otomatis saat masuk — registri Run.
    "Win32_System_Registry",
] }

# Ikon baki sistem. Tanpa ini, menutup jendela berarti mematikan agent — dan
# aplikasi remote desktop yang berhenti ketika jendelanya ditutup tidak dapat
# diandalkan untuk hal yang justru menjadi tugasnya.
#
# Ditaruh di akhir berkas dengan sengaja: tabel `[target...]` yang disisipkan
# di tengah `[dependencies]` akan menyerap seluruh baris setelahnya, dan
# gejalanya adalah puluhan galat "unresolved import" yang tidak menyebut
# Cargo.toml sama sekali.
[target.'cfg(windows)'.dependencies.tray-icon]
version = "0.19"
default-features = false

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
